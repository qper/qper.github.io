name: Deploy qper.github.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify landing page and prebuilt course
        run: |
          test -s index.html
          test -s CNAME
          test -s script.js
          test -s styles.css
          test -d img
          test -s js/index.html
          test -s js/assets/app.js
          test -s js/lessons/14-game/index.html

      - name: Prepare the combined Pages artifact
        run: |
          mkdir -p _site
          cp -a CNAME img index.html script.js styles.css js _site/
          test -s _site/index.html
          test -s _site/CNAME
          test -s _site/js/index.html
          test -s _site/js/lessons/14-game/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the complete site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
