name: Deploy landing page and JavaScript course

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the course
        working-directory: ./js
        run: npm run build

      - name: Test the course
        working-directory: ./js
        run: npm test

      - name: Assemble the Pages site
        run: |
          test -s index.html
          test -s CNAME
          test -d img
          test -s script.js
          test -s styles.css
          test -s js/dist/js/index.html
          test -s js/dist/js/lessons/14-game/index.html

          rm -rf _site
          mkdir -p _site/js
          cp -a CNAME img index.html script.js styles.css _site/
          cp -a js/dist/js/. _site/js/

          test -s _site/index.html
          test -s _site/CNAME
          test -s _site/js/index.html
          test -s _site/js/lessons/14-game/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5