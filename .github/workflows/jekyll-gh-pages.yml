name: Deploy Jekyll site and JavaScript course

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the course
        working-directory: ./js
        run: npm run build

      - name: Test the course
        working-directory: ./js
        run: npm test

      - name: Check the generated course entry page
        run: test -s js/dist/js/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build the landing page with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Put the generated course at /js/
        run: |
          rm -rf _site/js
          mkdir -p _site/js
          cp -a js/dist/js/. _site/js/
          test -s _site/index.html
          test -s _site/CNAME
          test -s _site/js/index.html
          test -s _site/js/lessons/14-game/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
